name: Roblox validation
on:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository documentation integrity
        run: python3 scripts/verify_docs.py
      - uses: ok-nick/setup-aftman@v0.4.2
      - name: Lint Luau
        run: selene src scripts/test_worker_payroll.luau scripts/test_onboarding.luau scripts/test_trade_rules.luau scripts/test_trade_receipt_policy.luau scripts/test_trade_audit.luau scripts/test_trade_retention.luau scripts/test_trade_persistence.luau scripts/test_trade_store_adapter.luau scripts/test_trade_settlement.luau scripts/test_creature_rigs.luau scripts/test_session_policy.luau scripts/test_terrain_plan.luau scripts/test_terrain_real_world.luau scripts/export_creatures.luau
      - name: Run worker payroll regressions (headless Luau)
        run: lune run scripts/test_worker_payroll.luau
      - name: Run first-session objective regressions (headless Luau)
        run: lune run scripts/test_onboarding.luau
      - name: Run safe-context trade regressions (headless Luau)
        run: lune run scripts/test_trade_rules.luau
      - name: Fault-inject durable trade receipt state machine (headless Luau)
        run: lune run scripts/test_trade_receipt_policy.luau
      - name: Verify restart-safe trade lifecycle audit (headless Luau)
        run: lune run scripts/test_trade_audit.luau
      - name: Compact terminal trade receipts after safe retention (headless Luau)
        run: lune run scripts/test_trade_retention.luau
      - name: Fault-inject session-checked trade persistence adapter (headless Luau)
        run: lune run scripts/test_trade_persistence.luau
      - name: Fault-inject concrete DataStore trade wrapper (headless Luau)
        run: lune run scripts/test_trade_store_adapter.luau
      - name: Synchronize durable trade result into detached live snapshots (headless Luau)
        run: lune run scripts/test_trade_settlement.luau
      - name: Run stale-session ownership regressions (headless Luau)
        run: lune run scripts/test_session_policy.luau
      - name: Inspect creature rigs and animation pose regressions (headless)
        run: lune run scripts/test_creature_rigs.luau
      - name: Validate deterministic real voxel terrain clearance plan (headless Luau)
        run: lune run scripts/test_terrain_plan.luau
      - name: Validate first-session gameplay contracts
        run: python3 scripts/verify_gameplay_contract.py
      - name: Validate game HUD structure and routes
        run: python3 scripts/verify_ui_contract.py
      - name: Generate authored 3D world
        run: python3 scripts/build_world.py
      - name: Build actual-map terrain obstacle fixture
        run: python3 scripts/extract_terrain_obstacles.py world/PlanetVerdant.rbxmx terrain_obstacles.json
      - name: Validate real-map voxel terrain distribution
        run: lune run scripts/test_terrain_real_world.luau
      - name: Export original editable creature rigs
        run: lune run scripts/export_creatures.luau
      - name: Build Roblox place file
        run: rojo build default.project.json -o GorpsEvolution.rbxlx
      - name: Build packaged-map terrain obstacle fixture
        run: python3 scripts/extract_terrain_obstacles.py GorpsEvolution.rbxlx terrain_obstacles.json
      - name: Validate packaged-map voxel terrain distribution
        run: lune run scripts/test_terrain_real_world.luau
      - name: Verify packaged fantasy lighting and art direction
        run: python3 scripts/verify_environment_lighting.py default.project.json GorpsEvolution.rbxlx
      - name: Verify authored planet model
        run: python3 scripts/verify_world.py world/PlanetVerdant.rbxmx GorpsEvolution.rbxlx
      - name: Verify first-session map routes and silhouettes
        run: python3 scripts/verify_map_routes.py world/PlanetVerdant.rbxmx GorpsEvolution.rbxlx
      - name: Verify forest biome variety and static art budget
        run: python3 scripts/verify_biome_art.py world/PlanetVerdant.rbxmx GorpsEvolution.rbxlx
      - name: Verify ranch facade, work zones and upgrade silhouettes
        run: python3 scripts/verify_ranch_art.py src/server/World.lua world/PlanetVerdant.rbxmx GorpsEvolution.rbxlx
      - name: Verify original modeled resource assets
        run: python3 scripts/verify_resource_models.py world/PlanetVerdant.rbxmx GorpsEvolution.rbxlx
      - name: Validate baked ground and spawn
        run: python3 scripts/verify_spawn.py default.project.json GorpsEvolution.rbxlx
      - name: Assert packaged gameplay scripts
        run: python3 scripts/verify_runtime_package.py GorpsEvolution.rbxlx
      - name: Upload Studio build
        uses: actions/upload-artifact@v4
        with:
          name: GorpsEvolution-place
          path: GorpsEvolution.rbxlx

